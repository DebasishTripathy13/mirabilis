[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corestream"
version = "0.1.0"
description = "Tiered-memory streaming inference for consumer GPUs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hf = ["transformers>=4.44", "huggingface-hub>=0.24"]

[project.scripts]
corestream = "corestream.cli:main"
mirabilis = "mirabilis.cli:main"

[tool.setuptools.packages.find]
include = ["corestream*", "mirabilis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
